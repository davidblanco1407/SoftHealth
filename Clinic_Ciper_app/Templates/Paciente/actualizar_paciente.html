{% extends 'base.html' %}

{% load static %}

{% block title %}
    Actualizar Paciente
{% endblock %}

{% block content %}

    <form method="POST">
        {% csrf_token %}

        <!-- Mostrar mensaje de error si existe -->
        {% if mensaje_error %}
        <div class="alert error">
            {{ mensaje_error }}
        </div>
        {% endif %}

        <h2>Actualizar Paciente</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ paciente.nombre }}" required><br><br>

        <label for="documento">Documento:</label>
        <input type="text" id="documento" name="documento" value="{{ paciente.documento }}" required><br><br>

        <label for="tipo_documento">Tipo de Documento:</label>
        <select id="tipo_documento" name="tipo_documento" required>
            <option value="CC" {% if paciente.tipo_documento == "CC" %}selected{% endif %}>CC</option>
            <option value="TI" {% if paciente.tipo_documento == "TI" %}selected{% endif %}>TI</option>
            <option value="CE" {% if paciente.tipo_documento == "CE" %}selected{% endif %}>CE</option>
        </select><br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" value="{{ paciente.correo }}" required><br><br>

        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" class="fecha_nacimiento" value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}" required><br><br>

        <label for="eps">EPS:</label>
        <select id="eps" name="eps" required>
            {% for eps in eps_list %}
                <option value="{{ eps.id }}" {% if paciente.eps.id == eps.id %}selected{% endif %}>
                    {{ eps.nombre_eps }}
                </option>
            {% endfor %}
        </select>

        <label for="password">Nueva contraseña:</label>
        <input type="password" id="password" name="password" value="{{ paciente.password }}" required><br><br>

        <button type="submit">Actualizar</button>
    </form>

{% endblock %}
