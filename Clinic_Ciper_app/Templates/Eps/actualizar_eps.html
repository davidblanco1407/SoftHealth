{% extends 'base.html' %}

{% block title %}
    Actualizar EPS
{% endblock %}

{% block content %}
    <h2>Actualizar EPS</h2>

    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label for="codigo">Código:</label>
        <input type="number" id="codigo" name="codigo" value="{{ eps.codigo }}" required><br><br>

        <label for="nombre_eps">Nombre EPS:</label>
        <input type="text" id="nombre_eps" name="nombre_eps" value="{{ eps.nombre_eps }}" required><br><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion" value="{{ eps.direccion }}" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" value="{{ eps.telefono }}" required><br><br>

        <label for="correo_electronico">Correo Electronico:</label>
        <input type="email" id="correo_electronico" name="correo_electronico" value="{{ eps.correo_electronico }}" required><br><br>

        <button type="submit">Actualizar</button>
    </form>

{% endblock %}
