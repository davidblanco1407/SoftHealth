{% extends 'base.html' %}

{% load static %}

{% block title %}
    Actualizar Auxiliar
{% endblock %}

{% block content %}

    <form method="POST">
        {% csrf_token %}

        <!-- Mostrar mensaje de error si existe -->
        {% if mensaje_error %}
        <div class="alert error">
            {{ mensaje_error }}
        </div>
        {% endif %}

        <h2>Actualizar Auxiliar</h2>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ auxiliar.nombre }}" required><br><br>

        <label for="documento">Documento:</label>
        <input type="text" id="documento" name="documento" value="{{ auxiliar.documento }}" required><br><br>

        <label for="correo">Correo:</label>
        <input type="email" id="correo" name="correo" value="{{ auxiliar.correo }}" required><br><br>


        <label for="password">Nueva contraseña:</label>
        <input type="password" id="password" name="password" value="{{ auxiliar.password }}" required><br><br>

        <button type="submit">Actualizar</button>
    </form>

{% endblock %}
